# Template de referência — gerado automaticamente pelo sistema
version: "3.8"

networks:
  zabbix_net:
    driver: bridge

volumes:
  zabbix_db:
  zabbix_data:

services:
  zabbix-db:
    image: mariadb:10.11
    container_name: zabbix_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: zabbix123
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix123
    ports:
      - "3307:3306"
    volumes:
      - zabbix_db:/var/lib/mysql
    networks:
      - zabbix_net
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_bin
      - --default-authentication-plugin=mysql_native_password

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-6.4-latest
    container_name: zabbix_server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix_db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix123
    volumes:
      - zabbix_data:/var/lib/zabbix
    ports:
      - "10051:10051"
    networks:
      - zabbix_net
    depends_on:
      - zabbix-db

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-6.4-latest
    container_name: zabbix_web
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix_server
      DB_SERVER_HOST: zabbix_db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix123
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - zabbix_net
    depends_on:
      - zabbix-server

  zabbix-agent:
    image: zabbix/zabbix-agent:ubuntu-6.4-latest
    container_name: zabbix_agent
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix_server
    networks:
      - zabbix_net
    depends_on:
      - zabbix-server
